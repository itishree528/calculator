<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="calculator">

            <div class="top-bar">
                <h1>Calculator</h1>
                <button id="themeBtn">☀️</button>
            </div>

            <div class="display-container">
                <div id="previousDisplay"></div>
                <input type="text" id="display" value="0" readonly>
            </div>

            <div class="buttons">

                <button class="function" data-action="clear">AC</button>
                <button class="function" data-action="backspace">⌫</button>
                <button class="operator" data-value="%">%</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button class="function" data-action="sign">+/−</button>
                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equals" data-action="calculate">=</button>

            </div>

        </div>

        <div class="history">

            <div class="history-header">
                <h2>History</h2>
                <button id="clearHistory">Clear</button>
            </div>

            <div id="historyList">
                <p class="empty">No calculations yet</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
